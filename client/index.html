<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Utility Studio</title>
    <link rel="stylesheet" href="./css/studio.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">Utility Studio</div>
        <button id="flyoutBtn" class="icon-btn" type="button" data-action="menu">☰</button>
      </header>

      <div id="staleBanner" class="stale-banner hidden">
        ⚠ Host script is stale. Fully restart Premiere.
      </div>

      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Search tools" />
      </div>

      <div class="pin-strip" id="pinStrip">
        <button class="pin-btn" type="button" data-action="fit">Fit</button>
        <button class="pin-btn" type="button" data-action="fill">Fill</button>
        <button class="pin-btn" type="button" data-action="gaps">Gaps</button>
        <button class="pin-btn" type="button" data-action="undo">Undo</button>
      </div>

      <main id="sectionRoot" class="section-root">
        <section class="tool-section">
          <h3>⏱ Timeline</h3>
          <button class="tool" data-action="fit">Fit to Frame</button>
          <button class="tool" data-action="fill">Fill Frame</button>
          <button class="tool" data-action="gaps">Collapse All Gaps</button>
        </section>

        <section class="tool-section">
          <h3>🎬 Motion</h3>
          <button class="tool" data-action="motion">Motion Curves</button>
          <button class="tool" data-action="animation">Animation Presets</button>
        </section>

        <section class="tool-section">
          <h3>✨ Transitions</h3>
          <button class="tool" data-action="transition">Transition Library</button>
        </section>

        <section class="tool-section">
          <h3>🎨 Creative</h3>
          <button class="tool" data-action="carousel">3D Carousel</button>
        </section>

        <section class="tool-section">
          <h3>📦 Media</h3>
          <button class="tool" data-action="paste">Paste from Clipboard</button>
          <button class="tool" data-action="stock">Stock Media</button>
          <button class="tool" data-action="download">Download Media</button>
        </section>
      </main>

      <footer class="footer">
        <div id="statusText">Ready</div>
        <button id="logBtn" class="footer-btn" type="button" data-action="log" title="Show log">📋</button>
        <div id="buildText">build 0.1.0</div>
      </footer>
    </div>

    <script src="./js/cs.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
