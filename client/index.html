<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Utility Studio</title>
  <link rel="stylesheet" href="./css/studio.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Utility Studio</div>
    <button class="icon-btn" type="button" title="Menu" data-action="menu">☰</button>
  </header>

  <div id="staleBanner" class="stale-banner" style="display:none;">
    ⚠ Host script is stale. Fully restart Premiere.
  </div>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search tools..." />
  </div>

  <div class="pin-bar">
    <button class="pin-btn" type="button" data-action="fit" title="Fit to Frame">Fit</button>
    <button class="pin-btn" type="button" data-action="fill" title="Fill Frame">Fill</button>
    <button class="pin-btn" type="button" data-action="gaps" title="Close Gaps">Gaps</button>
    <button class="pin-btn" type="button" data-action="undo" title="Undo">Undo</button>
  </div>

  <main class="content">
    <section class="section">
      <h3 class="section-title">⏱ Timeline</h3>
      <button class="tool" data-action="fit">Fit to Frame</button>
      <button class="tool" data-action="fill">Fill Frame</button>
      <button class="tool" data-action="gaps">Collapse All Gaps</button>
    </section>

    <section class="section">
      <h3 class="section-title">🎬 Motion</h3>
      <button class="tool" data-action="motion">Motion Curves</button>
      <button class="tool" data-action="preset">Motion Presets</button>
    </section>

    <section class="section">
      <h3 class="section-title">✨ Transitions</h3>
      <button class="tool" data-action="transition">Transition Library</button>
    </section>

    <section class="section">
      <h3 class="section-title">🎨 Creative</h3>
      <button class="tool" data-action="carousel">3D Carousel</button>
    </section>

    <section class="section">
      <h3 class="section-title">📦 Media</h3>
      <button class="tool" data-action="paste">Paste from Clipboard</button>
      <button class="tool" data-action="stock">Stock Media</button>
      <button class="tool" data-action="download">Download Media</button>
    </section>
  </main>

  <footer class="footer">
    <div id="statusText" class="status-info">Ready</div>
    <button class="footer-btn" type="button" data-action="showLog" title="Show Log">📋</button>
    <div id="buildText" class="build-text">build 0.1.0</div>
  </footer>
</div>

<script src="./js/cs.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
